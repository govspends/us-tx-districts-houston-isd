status = "First edition, 2026-10-07; not independently reviewed"
headline = "General Fund deficits grew to $310.6 million in FY2025 and reserves fell $379 million in two years, even as combined state-and-local per-student funding rose modestly; the state's larger share is mostly 2023 tax-compression legislation eliminating HISD's recapture payment, not new money."
